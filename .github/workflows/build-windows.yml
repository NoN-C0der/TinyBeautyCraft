name: Build Windows Launcher

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version for the release (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'
      create_github_release:
        description: 'Create GitHub Release after build'
        required: false
        type: boolean
        default: false

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          #cache-dependency-path: |
            #gui/package-lock.json
            #package-lock.json

      # Установка зависимостей корневого проекта (если есть)
      - name: Install root dependencies
        run: |
          if (Test-Path "package.json") {
            Write-Host "Installing root dependencies..."
            npm install --legacy-peer-deps
          } else {
            Write-Host "No root package.json found, skipping..."
          }
        shell: pwsh

      # Установка зависимостей GUI (обязательно)
      - name: Install GUI dependencies
        run: |
          cd gui
          npm install --legacy-peer-deps
          cd ..

      # Сборка C++ модулей (если есть)
      - name: Rebuild native modules
        run: |
          cd gui
          if (Test-Path "binding.gyp") {
            npm run rebuild || echo "Rebuild failed, but continuing..."
          } else {
            echo "No native modules to rebuild"
          }
          cd ..
        shell: pwsh
        continue-on-error: true

      # Сборка React-приложения (Vite)
      - name: Build frontend
        run: |
          cd gui
          npm run build
          cd ..

      # Упаковка Electron приложения через electron-builder
      - name: Package for Windows
        run: |
          cd gui
          npm run dist:win
          cd ..

      # Загрузка артефактов сборки (установщики)
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            gui/dist/*.exe
            gui/dist/*.blockmap
            gui/dist/*.yml
          retention-days: 30

      # Создание GitHub Release (опционально, по флагу)
      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_github_release == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_version }}
          name: "Release ${{ github.event.inputs.release_version }}"
          body: "Автоматическая сборка лаунчера для Windows.\nВерсия: ${{ github.event.inputs.release_version }}\nВремя сборки: ${{ github.run_id }}"
          draft: false
          prerelease: false
          files: |
            gui/dist/*.exe
            gui/dist/*.blockmap
            gui/dist/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
